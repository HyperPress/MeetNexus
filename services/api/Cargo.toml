[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "ws"] }
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
hmac = "0.12.1"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
redis = { version = "1.4.1", features = ["tokio-comp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10.6"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
thiserror = "2.0.19"
tokio = { version = "1.53.0", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "trace", "request-id"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "5.5.0", features = ["axum_extras"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
